<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <title>Page not found | Your Name</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      color: #1d2730; background: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .page { width: min(620px, 100%); padding: 48px 0; border-top: 1px solid #1d2730; border-bottom: 1px solid #dde3e8; }
    .code { margin: 0 0 10px; color: #0b4f8a; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.4rem, 8vw, 4.6rem); font-weight: 500; line-height: 1.05; letter-spacing: -.04em; }
    p { max-width: 480px; margin: 0 0 26px; color: #65717c; line-height: 1.7; }
    a { color: #0b4f8a; font-weight: 650; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <main class="page">
    <p class="code">404 &middot; Page not found</p>
    <h1>That page does not exist.</h1>
    <p>The page may have moved. You can return to the home page below.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
